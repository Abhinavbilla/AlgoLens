server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the api container up through Docker's DNS on each request (cached 10 s), rather
    # than once at startup: otherwise recreating the api container leaves nginx sending
    # requests to its old address (502) until web is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Progress is streamed with server-sent events (M5); don't buffer it.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
