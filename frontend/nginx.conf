server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the api container up through Docker's DNS on each request (cached 10 s), rather
    # than once at startup: otherwise recreating the api container leaves nginx sending
    # requests to its old address (502) until web is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # On a server, Caddy (HTTPS) sits in front and passes the visitor's address in
    # X-Forwarded-For. Trust that header only from Docker's private network, so per-visitor
    # limits see the real visitor rather than Caddy.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # The visitor's address, for the tutor chat's per-visitor limit.
        proxy_set_header X-Real-IP $remote_addr;
        # Progress is streamed with server-sent events (M5); don't buffer it.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
