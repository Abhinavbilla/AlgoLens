name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algolens
          POSTGRES_PASSWORD: algolens
          POSTGRES_DB: algolens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algolens" --health-interval 2s --health-retries 30
    env:
      ALGOLENS_TEST_DATABASE_URL: postgresql+psycopg://algolens:algolens@localhost:5432/algolens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Lint the sandbox with the same rules
        run: |
          ruff check ../sandbox --config pyproject.toml --exclude ../sandbox/spike
          ruff format --check ../sandbox --config pyproject.toml --exclude ../sandbox/spike
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    # One command brings the whole stack up healthy (M0), with a verified sandbox (M1).
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; nsjail needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Failures below are also published as ::error annotations, which anyone can read
      # (full job logs need a GitHub login, even on a public repo).
      - name: Compose configuration
        run: |
          docker compose version
          if ! out=$(docker compose config --quiet 2>&1); then
            echo "::error title=compose config::$(echo "$out" | tail -8 | tr '\n' ' ' | cut -c1-2000)"
            exit 1
          fi
      # Brings up every service; the sandbox only turns healthy if its self-test proves isolation.
      - name: Start the stack
        run: |
          set -o pipefail
          if ! docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee /tmp/up.log; then
            echo "::error title=compose up::$(grep -iE 'error|fail|unhealthy|denied' /tmp/up.log | tail -12 | tr '\n' ' ' | cut -c1-3000)"
            echo "::error title=sandbox log::$(docker compose logs --no-color --tail 40 sandbox 2>&1 | tr '\n' ' ' | cut -c1-3000)"
            exit 1
          fi
      - run: curl --fail --silent http://127.0.0.1:8080/api/health | tee /dev/stderr | grep -q '"sandbox":"ok"'
      - run: curl --fail --silent http://127.0.0.1:8080/ | grep -q "<title>AlgoLens</title>"
      - name: Sandbox hostile-code suite
        run: docker compose --profile test run --rm sandbox-test
      - name: Backend tests against the real database and sandbox (Python 3.12)
        run: docker compose --profile test run --rm backend-test
      - name: Verify the algorithm library in the sandbox
        run: docker compose exec -T api algolens library verify
      - if: failure()
        run: docker compose logs || true
      - if: always()
        run: docker compose down -v || true
