name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algolens
          POSTGRES_PASSWORD: algolens
          POSTGRES_DB: algolens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algolens" --health-interval 2s --health-retries 30
    env:
      ALGOLENS_TEST_DATABASE_URL: postgresql+psycopg://algolens:algolens@localhost:5432/algolens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    # The M0 done criterion: one command brings the whole stack up healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: curl --fail --silent http://127.0.0.1:8080/api/health
      - run: curl --fail --silent http://127.0.0.1:8080/ | grep -q "<title>AlgoLens</title>"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
