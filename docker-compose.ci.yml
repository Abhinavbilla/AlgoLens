# CI-only override (GitHub's ubuntu runners have AppArmor; this machine's WSL kernel doesn't).
# Docker's default AppArmor profile denies mount(), which nsjail needs to build its jail.
# The sandbox's own startup self-test still has to pass, so this can't silently weaken
# isolation: if the jail doesn't hold, the sandbox reports unhealthy and CI fails.
# See sandbox/spike/RESULTS.md, "Open risk for CI and other Linux hosts".
services:
  sandbox:
    security_opt: !override  # replace the base list (compose versions merge lists differently)
      - no-new-privileges:true
      - seccomp=./sandbox/seccomp/sandbox.json
      - apparmor=unconfined
  sandbox-test:
    security_opt: !override  # replace the base list (compose versions merge lists differently)
      - no-new-privileges:true
      - seccomp=./sandbox/seccomp/sandbox.json
      - apparmor=unconfined
