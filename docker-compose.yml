name: algolens

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    ALGOLENS_DATABASE_URL: postgresql+psycopg://algolens:algolens@db:5432/algolens

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algolens
      POSTGRES_PASSWORD: algolens
      POSTGRES_DB: algolens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algolens"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    command: ["algolens", "serve"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *backend
    command: ["algolens", "worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
