name: algolens

x-backend: &backend
  image: algolens-backend
  env_file:
    - path: .env
      required: false
  environment:
    ALGOLENS_DATABASE_URL: postgresql+psycopg://algolens:algolens@db:5432/algolens
    ALGOLENS_SANDBOX_SOCKET: /run/sandbox/sandbox.sock
  volumes:
    - sandbox-socket:/run/sandbox

# Untrusted code runs here. Every setting is deliberate: see sandbox/spike/RESULTS.md.
x-sandbox-security: &sandbox-security
  network_mode: none          # talks to the backend only through the socket volume
  read_only: true
  cap_drop: [ALL]             # no capabilities at all; nsjail uses user namespaces instead
  security_opt:
    - no-new-privileges:true
    - seccomp=./sandbox/seccomp/sandbox.json   # Docker default + namespace syscalls
  tmpfs:
    - /tmp:size=64m           # noexec (Docker's default for tmpfs)
    - /jobs:size=1g,exec,uid=10001,gid=10001,mode=0700   # job folders; C++ binaries run here
  mem_limit: 2g
  pids_limit: 256
  cpus: 2

services:
  sandbox:
    <<: *sandbox-security
    restart: unless-stopped  # comes back by itself when Docker starts
    build:
      context: ./sandbox
      target: runtime
    volumes:
      - sandbox-socket:/run/sandbox

  # Runs the sandbox's hostile-code suite under the same restrictions:
  #   docker compose --profile test run --rm sandbox-test
  sandbox-test:
    <<: *sandbox-security
    profiles: [test]
    build:
      context: ./sandbox
      target: test

  # Backend tests against the real database and sandbox, on Python 3.12:
  #   docker compose --profile test run --rm backend-test
  backend-test:
    profiles: [test]
    image: algolens-backend-test
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      ALGOLENS_TEST_DATABASE_URL: postgresql+psycopg://algolens:algolens@db:5432/algolens_test
      ALGOLENS_TEST_SANDBOX_SOCKET: /run/sandbox/sandbox.sock
    volumes:
      - sandbox-socket:/run/sandbox
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped  # comes back by itself when Docker starts
    environment:
      POSTGRES_USER: algolens
      POSTGRES_PASSWORD: algolens
      POSTGRES_DB: algolens
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algolens"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *backend
    restart: unless-stopped  # comes back by itself when Docker starts
    # Built once here; the worker runs the same image.
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime   # the Dockerfile's last stage is the test image
    command: ["algolens", "serve"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *backend
    restart: unless-stopped  # comes back by itself when Docker starts
    pull_policy: never  # local image built by the api service
    command: ["algolens", "worker"]
    depends_on:
      api:
        condition: service_healthy
      sandbox:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped  # comes back by itself when Docker starts
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  sandbox-socket:
